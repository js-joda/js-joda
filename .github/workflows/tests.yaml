name: js-joda build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: Install
        # native npm workspaces: a single root install links all packages
        run: npm ci
      - name: Build
        run: |
          set -e;
          npx lerna run --stream build-dist;
          npx lerna run --stream build-locale-dist;
      - name: Test
        run: |
          npx lerna run --stream lint;
          npm run build-esdoc;
          npx lerna run --stream test;
          npx lerna run --stream test-ts-definitions;
          npx lerna run --stream test-coverage;
          npx lerna run --concurrency 1 --stream test-browser -- -- --browserNoActivityTimeout 20000;
          npm run build-test-coverage-report;
      - name: Test examples (dist integration)
        # private package, excluded from `lerna run`; needs the built dist artifacts
        run: npm test -w packages/examples;
      - name: Lint and test tzdb-builder
        # private package, excluded from `lerna run`; deps come from the root workspace install
        run: |
          set -e;
          npm run lint -w packages/tzdb-builder;
          npm test -w packages/tzdb-builder;
      - name: Push coverage data to coveralls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./build/coverage/lcov.info


